# Temporary diagnostic for issue #6: does a workflow start when it uses no-actions?
name: Probe no-actions
on:
  push:
    branches: [claude/ci-startup-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo "runner started"; uname -a
