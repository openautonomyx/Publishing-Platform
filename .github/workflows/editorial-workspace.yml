name: Editorial Workspace Checks
on:
  push:
    paths:
      - 'workspace-api/**'
      - 'frontend/**'
      - '.github/workflows/editorial-workspace.yml'
  pull_request:
    paths:
      - 'workspace-api/**'
      - 'frontend/**'
      - '.github/workflows/editorial-workspace.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test publishing lifecycle
        run: node --test workspace-api/server.test.cjs
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
