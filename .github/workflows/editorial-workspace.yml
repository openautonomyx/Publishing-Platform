name: Editorial Workspace Checks
on:
  push:
    paths:
      - 'workspace-api/**'
      - 'frontend/**'
      - '.github/workflows/editorial-workspace.yml'
      - 'scripts/**'
      - 'compose.workspace.yml'
  pull_request:
    paths:
      - 'workspace-api/**'
      - 'frontend/**'
      - '.github/workflows/editorial-workspace.yml'
      - 'scripts/**'
      - 'compose.workspace.yml'
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate tests, frontend, and container lifecycle
        run: RUN_DOCKER_SMOKE=1 bash scripts/validate-workspace.sh
